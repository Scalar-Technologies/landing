<body>
  <a class="skip-link" href="#main">Přejít na obsah</a>

  <header class="site-header wrap">
    <a class="brand" href="./" aria-label="Scalar Technologies — úvod">
      <svg viewBox="0 0 175 175" aria-hidden="true"><rect x="8" y="8" width="159" height="159" fill="none" stroke="currentColor" stroke-width="16"/><circle cx="87.5" cy="87.5" r="16.5" fill="currentColor"/></svg>
    </a>
    <nav class="site-nav" aria-label="Hlavní navigace">
      <ul>
        <li><a href="./">O nás</a></li>
        <li><a href="klienti">Partneři</a></li>
        <li><a href="kontakt" aria-current="page">Kontakt</a></li>
        <li class="lang"><a href="../contact" hreflang="en" lang="en" title="English">EN</a><span aria-current="true" title="Česky">CZ</span></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="wrap">
    <section class="contact" aria-labelledby="contact-title">
      <div class="contact__info">
        <h1 class="page-title" id="contact-title">Kontaktujte nás</h1>
        <address>
          Scalar Technologies s.r.o.<br>
          IČ: 13979132, DIČ: CZ13979132<br>
          <a href="https://maps.google.com/?q=Evropsk%C3%A1+516%2F10%2C+160+00+Praha+6" target="_blank" rel="noopener">Evropská 516/10, Dejvice, Praha, <span class="nowrap">160 00</span></a><br>
          <a class="email" href="mailto:info@scalar.cc">info@scalar.cc</a>
        </address>
      </div>

      <div class="contact__form-wrap">
        <form class="contact-form" data-mailto-form="info@scalar.cc"
              data-subject="Dotaz z webu od" data-reply="Odpovědět na:"
              data-note="Nyní by se měla otevřít vaše e-mailová aplikace. Pokud se tak nestane, napište nám přímo na"
              action="mailto:info@scalar.cc" method="post" enctype="text/plain">
          <label for="email">Váš e-mail</label>
          <input id="email" name="email" type="email" placeholder="Váš e-mail" autocomplete="email" required>
          <label for="message">Váš dotaz</label>
          <textarea id="message" name="message" placeholder="Váš dotaz…" required></textarea>
          <button class="btn btn--light" type="submit">Odeslat</button>
          <p class="form-note" data-form-note aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer wrap">
    <p class="copyright">© <span data-year>2026</span> Scalar Technologies s.r.o.</p>
  </footer>

  <script src="../assets/js/main.js" defer></script>
